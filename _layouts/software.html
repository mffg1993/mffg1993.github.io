---
layout: default
---

{{ content }}

<h3 class="fw-bold border-bottom pb-3 mb-5">Software</h3>
{% for project in site.data.settings.software %}
<div class="row g-5 mb-5">
  <div class="col-md-6">
    <h5>{{ topic.name }}</h5>
    <p style="text-align: justify; text-justify: inter-word;"> {{ project.description }}</p>
  </div>
  <div class="col-md-6">
    <img src="{{ site.github.url }}/{{ topic.image }}" alt="Contact" width="100%">
  </div>
</div>
{% endfor %}
