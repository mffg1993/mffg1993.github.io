- period: '2019 – 2024'
  title: 'Ph.D. in Physics'
  institution: 'University of Ottawa'
  description: 'Supervisor: Prof. Ebrahim Karimi. Thesis: “Structuring Light: From knots to geometrical phases.” Investigated structured optical fields with tailored spatial, polarization, and phase properties, including optical vortex knots, non-trivial polarization states, and topological transitions of geometric phases.'

- period: '2017 – 2019'
  title: 'M.Sc. in Nanotechnology'
  institution: 'Tecnológico de Monterrey'
  description: 'Supervisor: Prof. Dorilian López-Mago. Thesis: “Optical forces on subwavelength-sized particles illuminated with structured light beams.” Investigated particle dynamics in structured optical fields and developed numerical models used in collaborative studies.'

- period: '2012 – 2016'
  title: 'B.Sc. in Engineering Physics'
  institution: 'Tecnológico de Monterrey'
  description: 'Supervisor: Prof. Dorilian López-Mago. Research project: “Internal energy flows in composite optical vortices.” Investigated optical-energy flow, interference, and propagation in composite structured-light fields.'
