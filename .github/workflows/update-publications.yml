name: Update publications

on:
  # Every Monday at 09:17 UTC. Using a non-zero minute reduces congestion
  # around the beginning of the hour.
  schedule:
    - cron: "17 9 * * 1"

  # Also provides an Actions > Run workflow button.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the website
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-publications.txt

      - name: Install updater requirements
        run: python -m pip install -r requirements-publications.txt

      - name: Retrieve publication metadata
        env:
          ORCID_ID: "0000-0003-1358-2049"

          # Optional: create this repository secret to add OpenAlex metadata,
          # open-access links, and OpenAlex citation counts.
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}

          # Optional: a repository variable used for Crossref's polite pool.
          CROSSREF_MAILTO: ${{ vars.CROSSREF_MAILTO }}
        run: python _scripts/update_publications.py

      - name: Commit an actual metadata change
        shell: bash
        run: |
          if git diff --quiet -- _data/publications.json; then
            echo "No publication changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add _data/publications.json
          git commit -m "chore: update publications"
          git push
