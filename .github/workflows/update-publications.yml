name: Update publications

on:
  schedule:
    - cron: "17 9 * * 1"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the website
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-publications.txt

      - name: Install reliable updater requirements
        run: python -m pip install -r requirements-publications.txt

      - name: Retrieve Crossref and OpenAlex metadata
        env:
          ORCID_ID: "0000-0003-1358-2049"
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
          CROSSREF_MAILTO: ${{ vars.CROSSREF_MAILTO }}
        run: python _scripts/update_publications.py

      - name: Merge regular, Scholar, and verified BibTeX records
        run: python _scripts/merge_publications.py

      - name: Commit actual metadata changes
        shell: bash
        run: |
          if git diff --quiet -- \
            _data/publications_regular.json \
            _data/publications.json \
            _data/publications_audit.json; then
            echo "No publication changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            _data/publications_regular.json \
            _data/publications.json \
            _data/publications_audit.json

          git commit -m "chore: update publications"
          git push
